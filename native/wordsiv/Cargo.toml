[package]
name = "wordsiv"
version = "0.3.1"
edition = "2021"
description = "Generate text with a limited character set for font proofing"
license = "MIT"

[lib]
name = "wordsiv"
crate-type = ["rlib"]

[dependencies]
regex = "1"
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
harfrust = { version = "0.5", optional = true }
read-fonts = { version = "0.37", optional = true }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
memmap2 = { version = "0.9", optional = true }
dirs = { version = "5", optional = true }
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }
ruzstd = "0.7"

[features]
default = []
shaping = ["dep:harfrust", "dep:read-fonts"]
semantic = ["dep:memmap2", "dep:dirs", "dep:zip"]

[dev-dependencies]
# test font for shaping tests (none needed — we use a bundled test font)
