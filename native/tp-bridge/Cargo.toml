[package]
name = "tp-bridge"
version = "0.1.0"
edition = "2021"

[lib]
name = "tpbridge"
crate-type = ["staticlib", "rlib"]

[dependencies]
tp-fonts = { path = "../tp-fonts" }
# No shaping/semantic: neither is reachable from the exposed FFI, and they
# pull in harfrust, zip, memmap2, dirs, a second read-fonts version, and a
# code path that would download 862 MB of embeddings via curl.
wordsiv = { path = "../wordsiv", default-features = false }
serde_json = "1"
