name: TypeProofing
options:
  bundleIdPrefix: com.dograytype
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

packages:
  CompactSlider:
    url: https://github.com/buh/CompactSlider.git
    from: "2.1.0"
  ProofCore:
    path: ../ProofCore

schemes:
  TypeProofing:
    build:
      targets:
        TypeProofing: all
        TypeProofingUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TypeProofingUITests
    archive:
      config: Release

targets:
  TypeProofing:
    type: application
    supportedDestinations: [macOS, iOS]
    sources:
      - path: TypeProofing/Sources/Shared
      - path: TypeProofing/Sources/macOS
        destinationFilters: [macOS]
      - path: TypeProofing/Sources/iOS
        destinationFilters: [iOS]
      - path: TypeProofing/Resources
        buildPhase: resources
        excludes:
          - "*.icon"
      - path: TypeProofing/Resources/TypeProofing.icon
        buildPhase: resources
        type: file
    entitlements:
      path: TypeProofing/TypeProofing.entitlements
    info:
      path: TypeProofing/Info.plist
      properties:
        CFBundleIconFile: TypeProofing
        CFBundleIconName: TypeProofing
        CFBundleDisplayName: "Type Proofing"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: "public.app-category.graphics-design"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dograytype.typeproofing
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: 2
        SUPPORTS_MACCATALYST: NO
        # macOS + simulator keep ad-hoc signing (previous behavior; releases
        # are signed by build_release.sh). Device builds sign automatically.
        CODE_SIGN_IDENTITY: "-"
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Development"
        "CODE_SIGN_STYLE[sdk=iphoneos*]": Automatic
        "DEVELOPMENT_TEAM[sdk=iphoneos*]": 8YVTA46P66
        # iOS gets its own Info.plist (launch screen, font document types) so
        # the macOS app's LaunchServices registrations stay untouched.
        "INFOPLIST_FILE[sdk=iphoneos*]": TypeProofing/Info-iOS.plist
        "INFOPLIST_FILE[sdk=iphonesimulator*]": TypeProofing/Info-iOS.plist
        # iOS app icon comes from the Icon Composer file (macOS references it
        # via CFBundleIconFile/Name instead, so this stays iOS-scoped).
        "ASSETCATALOG_COMPILER_APPICON_NAME[sdk=iphoneos*]": TypeProofing
        "ASSETCATALOG_COMPILER_APPICON_NAME[sdk=iphonesimulator*]": TypeProofing
        # Entitlements split: macOS keeps its (empty) file; iOS has its own,
        # ready for opt-ins like com.apple.developer.user-fonts later.
        CODE_SIGN_ENTITLEMENTS: TypeProofing/TypeProofing.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": TypeProofing/TypeProofing-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": TypeProofing/TypeProofing-iOS.entitlements
    dependencies:
      - package: CompactSlider
      - package: ProofCore
    preBuildScripts:
      - name: "Build TPNative.xcframework if missing"
        script: |
          if [ ! -d "${SRCROOT}/../ProofCore/Binaries/TPNative.xcframework" ]; then
            echo "TPNative.xcframework missing — building from Rust sources…"
            bash "${SRCROOT}/../native/build_rust.sh"
          fi
        basedOnDependencyAnalysis: false
    postBuildScripts: []

  TypeProofingUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: TypeProofingUITests
    settings:
      base:
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: TypeProofing
